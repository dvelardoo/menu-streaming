<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Streaming</title>

  <meta name="description" content="Tus accesos rápidos de streaming en una sola app.">
  <meta name="theme-color" content="#000000">

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Streaming">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="preload" href="./icons/icon-512.png" as="image">

  <style>
    :root{
      --bg:#000;
      --panel:#0d0d0f;
      --panel-2:#141417;
      --line:rgba(255,255,255,.09);
      --line-strong:rgba(255,255,255,.14);
      --text:#fff;
      --muted:#9c9ca5;
      --muted-2:#66666f;
      --radius:28px;
      --ease:cubic-bezier(.2,.8,.2,1);
      --page-x:18px;
      --page-top:24px;
      --page-bottom:30px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      color-scheme:dark;
      background:#000;
      min-height:100%;
    }

    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      overflow-x:hidden;
      color:var(--text);
      background:#000;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% -8%, rgba(255,255,255,.10), transparent 28%),
        radial-gradient(circle at 20% 60%, rgba(255,255,255,.025), transparent 30%);
    }

    /* SPLASH */
    .splash{
      position:fixed;
      inset:0;
      z-index:999;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.035), transparent 28%),
        #000;
      transition:
        opacity .5s ease,
        visibility .5s ease,
        transform .5s var(--ease);
    }

    .splash.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transform:scale(1.015);
    }

    .splash-logo{
      position:relative;
      width:92px;
      height:92px;
      display:grid;
      place-items:center;
      border-radius:27px;
      background:
        linear-gradient(145deg, #202024 0%, #111114 45%, #070708 100%);
      border:1px solid rgba(255,255,255,.11);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -10px 20px rgba(0,0,0,.35),
        0 24px 70px rgba(0,0,0,.72);
      animation:splashPop .72s var(--ease) both;
    }

    .splash-logo::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:21px;
      border:1px solid rgba(255,255,255,.035);
      pointer-events:none;
    }

    .splash-logo img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      border-radius:26px;
      animation:playPulse 1.15s ease-in-out both;
    }

    @keyframes splashPop{
      0%{
        opacity:0;
        transform:scale(.78) translateY(5px);
        filter:blur(5px);
      }
      60%{
        opacity:1;
        transform:scale(1.035) translateY(0);
        filter:blur(0);
      }
      100%{
        opacity:1;
        transform:scale(1);
      }
    }

    @keyframes playPulse{
      0%{transform:scale(.9);opacity:.35}
      55%{transform:scale(1.06);opacity:1}
      100%{transform:scale(1);opacity:1}
    }

    .app{
      position:relative;
      width:min(100%,470px);
      opacity:0;
      transform:translateY(8px);
      transition:opacity .55s ease, transform .55s var(--ease);
      margin:0 auto;
      padding:
        max(var(--page-top), env(safe-area-inset-top))
        max(var(--page-x), env(safe-area-inset-right))
        max(var(--page-bottom), env(safe-area-inset-bottom))
        max(var(--page-x), env(safe-area-inset-left));
    }

    .app.ready{
      opacity:1;
      transform:translateY(0);
    }

    .header{
      padding:12px 3px 24px;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:#d4d4d8;
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .brand-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#f4f4f5;
      box-shadow:0 0 14px rgba(255,255,255,.75);
    }

    .connection{
      color:var(--muted-2);
      font-size:11px;
    }

    h1{
      margin:0;
      max-width:390px;
      font-size:clamp(40px,11.5vw,54px);
      line-height:.96;
      letter-spacing:-.06em;
      font-weight:850;
    }

    .subtitle{
      margin:12px 0 0;
      max-width:340px;
      color:var(--muted);
      font-size:14.5px;
      line-height:1.45;
    }

    .section-label{
      margin:2px 4px 11px;
      color:#c9c9ce;
      font-size:12px;
      font-weight:700;
      letter-spacing:.035em;
      text-transform:uppercase;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .card{
      --accent:rgba(255,255,255,.12);
      --mx:50%;
      --my:50%;
      --tilt-x:0deg;
      --tilt-y:0deg;

      position:relative;
      min-height:172px;
      padding:15px;
      overflow:hidden;
      isolation:isolate;

      display:flex;
      flex-direction:column;
      justify-content:space-between;

      border:1px solid var(--line);
      border-radius:var(--radius);
      background:
        linear-gradient(150deg, rgba(255,255,255,.075), rgba(255,255,255,.018) 55%),
        var(--panel);

      color:#fff;
      text-decoration:none;

      box-shadow:
        0 20px 50px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.07);

      transform:translateZ(0);
      transition:
        transform .16s var(--ease),
        border-color .18s ease,
        background .18s ease,
        filter .18s ease,
        box-shadow .18s ease;

      opacity:0;
      transform:translateY(12px) scale(.985);
    }

    .app.ready .card{
      animation:cardIn .48s var(--ease) forwards;
    }

    .app.ready .card:nth-child(1){animation-delay:.03s}
    .app.ready .card:nth-child(2){animation-delay:.08s}
    .app.ready .card:nth-child(3){animation-delay:.13s}
    .app.ready .card:nth-child(4){animation-delay:.18s}

    .card::before{
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      right:-65px;
      bottom:-80px;
      z-index:-1;
      border-radius:50%;
      background:var(--accent);
      filter:blur(22px);
      opacity:.75;
      pointer-events:none;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:linear-gradient(130deg, rgba(255,255,255,.06), transparent 38%);
      pointer-events:none;
    }

    .card .touch-glow{
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(
          circle 110px at var(--mx) var(--my),
          rgba(255,255,255,.13),
          rgba(255,255,255,.045) 34%,
          transparent 68%
        );
      transition:opacity .2s ease;
    }

    .card.interacting .touch-glow{
      opacity:1;
    }

    .card:hover{
      transform:
        perspective(700px)
        rotateX(var(--tilt-x))
        rotateY(var(--tilt-y))
        translateY(-3px);
      border-color:var(--line-strong);
      background:
        linear-gradient(150deg, rgba(255,255,255,.095), rgba(255,255,255,.025) 55%),
        var(--panel-2);
    }

    .card:active{
      transform:scale(.975);
      filter:brightness(.94);
    }

    .card.leaving{
      transform:scale(.955);
      filter:brightness(.78);
      box-shadow:
        0 10px 28px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .card:focus-visible,
    .install-btn:focus-visible{
      outline:3px solid rgba(255,255,255,.9);
      outline-offset:4px;
    }

    .football{--accent:rgba(64,180,105,.22)}
    .series{--accent:rgba(128,92,210,.22)}
    .youtube{--accent:rgba(210,70,70,.22)}
    .twitch{--accent:rgba(150,90,220,.22)}

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .icon-box{
      width:50px;
      height:50px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.11);
      border-radius:16px;
      background:rgba(255,255,255,.055);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
      transition:
        transform .18s var(--ease),
        background .18s ease,
        border-color .18s ease;
    }

    .card.interacting .icon-box{
      transform:translateY(-2px) scale(1.035);
      background:rgba(255,255,255,.075);
      border-color:rgba(255,255,255,.15);
    }

    .icon-box svg{
      width:25px;
      height:25px;
      fill:none;
      stroke:#f4f4f5;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .icon-box svg .fill{
      fill:#f4f4f5;
      stroke:none;
    }

    .arrow{
      padding-top:3px;
      color:#85858e;
      font-size:25px;
      line-height:1;
      transition:transform .18s ease,color .18s ease;
    }

    .card:hover .arrow{
      transform:translateX(3px);
      color:#fff;
    }

    .card-copy{
      padding-top:22px;
    }

    .card-title{
      margin:0 0 6px;
      font-size:18px;
      line-height:1.1;
      font-weight:820;
      letter-spacing:-.025em;
    }

    .card-desc{
      margin:0;
      max-width:95%;
      color:#a5a5ad;
      font-size:12px;
      line-height:1.4;
    }

    .install{
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-top:18px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(255,255,255,.035);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .install.visible{
      display:flex;
      animation:fadeUp .4s ease both;
    }

    .install-copy strong{
      display:block;
      margin-bottom:3px;
      font-size:13px;
    }

    .install-copy span{
      color:var(--muted);
      font-size:11px;
      line-height:1.35;
    }

    .install-btn{
      flex:0 0 auto;
      border:0;
      border-radius:999px;
      padding:9px 13px;
      background:#f4f4f5;
      color:#08080a;
      font:inherit;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }

    .footer{
      padding:22px 4px 3px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:#53535c;
      font-size:10px;
      letter-spacing:.03em;
    }

    .footer-mark{
      font-weight:800;
      letter-spacing:.13em;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes cardIn{
      from{opacity:0;transform:translateY(14px) scale(.98)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    @media(max-width:390px){
      :root{
        --page-x:14px;
        --page-top:20px;
        --page-bottom:24px;
      }

      .header{
        padding-top:8px;
        padding-bottom:20px;
      }

      .topline{
        margin-bottom:16px;
      }

      h1{
        font-size:clamp(38px,11.2vw,48px);
      }

      .subtitle{
        font-size:14px;
      }

      .grid{
        gap:10px;
      }

      .card{
        min-height:162px;
        padding:14px;
        border-radius:24px;
      }

      .icon-box{
        width:47px;
        height:47px;
      }

      .card-copy{
        padding-top:18px;
      }

      .card-title{
        font-size:17px;
      }

      .card-desc{
        font-size:11.5px;
      }
    }

    @media(max-width:340px){
      .grid{
        grid-template-columns:1fr;
      }

      .card{
        min-height:132px;
      }

      .card-copy{
        padding-top:16px;
      }
    }

    @media(min-width:700px){
      .app{
        width:min(100%,620px);
      }

      .card{
        min-height:184px;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation:none!important;
        transition:none!important;
      }
    }
  </style>
</head>

<body>

  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-logo">
      <img
        src="./icons/icon-512.png"
        alt=""
        width="92"
        height="92"
        aria-hidden="true"
      >
    </div>
  </div>

  <main class="app" id="app">
    <header class="header">
      <div class="topline">
        <div class="brand">
          <span class="brand-dot"></span>
          Streaming
        </div>
        <div class="connection" id="connectionStatus">En línea</div>
      </div>

      <h1>¿Qué vemos?</h1>
      <p class="subtitle">Tus accesos de entretenimiento, sin ruido.</p>
    </header>

    <div class="section-label">Destacados</div>

    <nav class="grid" id="servicesGrid" aria-label="Servicios de streaming"></nav>

    <section class="install" id="installPanel" aria-live="polite">
      <div class="install-copy">
        <strong>Instalar Streaming</strong>
        <span>Ábrela como una app, sin la barra del navegador.</span>
      </div>
      <button class="install-btn" id="installBtn" type="button">Instalar</button>
    </section>

    <footer class="footer">
      <span class="footer-mark">STREAMING</span>
      <span id="appMode">Web app</span>
    </footer>
  </main>

  <script>
    const splash = document.getElementById("splash");
    const app = document.getElementById("app");
    const connectionStatus = document.getElementById("connectionStatus");
    const installPanel = document.getElementById("installPanel");
    const installBtn = document.getElementById("installBtn");
    const appMode = document.getElementById("appMode");
    const servicesGrid = document.getElementById("servicesGrid");

    // =========================================================
    // SERVICIOS
    // Para añadir o cambiar un acceso, edita SOLO este bloque.
    // =========================================================
    const services = [
      {
        name: "Fútbol",
        description: "Partidos y retransmisiones en directo.",
        url: "https://www.fctv33hd.fun/es",
        type: "football",
        icon: "football"
      },
      {
        name: "Series y pelis",
        description: "Series, películas y entretenimiento.",
        url: "https://series.ly/",
        type: "series",
        icon: "movies"
      },
      {
        name: "YouTube",
        description: "Vídeos, música, directos y canales.",
        url: "https://www.youtube.com/",
        type: "youtube",
        icon: "youtube"
      },
      {
        name: "Twitch",
        description: "Directos, gaming y creadores.",
        url: "https://www.twitch.tv/",
        type: "twitch",
        icon: "twitch"
      }
    ];

    const icons = {
      football: `
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.2 9.1 12 7.2l2.8 1.9-1 3.2h-3.6z"/>
          <path d="m7.1 5.9 2.1 3.2M16.9 5.9l-2.1 3.2M5.2 13.2l5 1.9M18.8 13.2l-5 1.9M8.7 19.1l1.5-4M15.3 19.1l-1.5-4"/>
        </svg>
      `,
      movies: `
        <svg viewBox="0 0 24 24">
          <path d="M4 8h16v11H4z"/>
          <path d="M4 8 7 4h4L8 8m3 0 3-4h4l-3 4"/>
          <path class="fill" d="m10 11 5 3-5 3z"/>
        </svg>
      `,
      youtube: `
        <svg viewBox="0 0 24 24">
          <rect x="3.5" y="5.5" width="17" height="13" rx="3"/>
          <path class="fill" d="m10 9 5 3-5 3z"/>
        </svg>
      `,
      twitch: `
        <svg viewBox="0 0 24 24">
          <path d="M5 4h15v10l-4 4h-4l-3 2v-2H5z"/>
          <path d="M10 8v4M15 8v4"/>
        </svg>
      `,
      play: `
        <svg viewBox="0 0 24 24">
          <path class="fill" d="M8.2 5.8c0-1.1 1.2-1.8 2.1-1.2l8.4 6c.8.6.8 1.8 0 2.4l-8.4 6c-.9.6-2.1 0-2.1-1.2z"/>
        </svg>
      `
    };

    function renderServices() {
      servicesGrid.innerHTML = services.map(service => `
        <a
          class="card ${service.type || ""}"
          href="${service.url}"
          aria-label="Abrir ${service.name}"
        >
          <span class="touch-glow" aria-hidden="true"></span>

          <div class="card-head">
            <div class="icon-box" aria-hidden="true">
              ${icons[service.icon] || icons.play}
            </div>
            <span class="arrow" aria-hidden="true">›</span>
          </div>

          <div class="card-copy">
            <h2 class="card-title">${service.name}</h2>
            <p class="card-desc">${service.description}</p>
          </div>
        </a>
      `).join("");
    }

    renderServices();

    // Efecto táctil / profundidad muy sutil.
    document.querySelectorAll(".card").forEach(card => {
      const updatePointer = (clientX, clientY) => {
        const rect = card.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const px = Math.max(0, Math.min(100, (x / rect.width) * 100));
        const py = Math.max(0, Math.min(100, (y / rect.height) * 100));

        const tiltY = ((px - 50) / 50) * 2.2;
        const tiltX = -((py - 50) / 50) * 2.2;

        card.style.setProperty("--mx", `${px}%`);
        card.style.setProperty("--my", `${py}%`);
        card.style.setProperty("--tilt-x", `${tiltX}deg`);
        card.style.setProperty("--tilt-y", `${tiltY}deg`);
      };

      card.addEventListener("pointerenter", event => {
        card.classList.add("interacting");
        updatePointer(event.clientX, event.clientY);
      });

      card.addEventListener("pointermove", event => {
        updatePointer(event.clientX, event.clientY);
      });

      card.addEventListener("pointerleave", () => {
        card.classList.remove("interacting");
        card.style.setProperty("--mx", "50%");
        card.style.setProperty("--my", "50%");
        card.style.setProperty("--tilt-x", "0deg");
        card.style.setProperty("--tilt-y", "0deg");
      });

      card.addEventListener("pointerdown", event => {
        card.classList.add("interacting");
        updatePointer(event.clientX, event.clientY);
      });

      card.addEventListener("pointerup", () => {
        setTimeout(() => card.classList.remove("interacting"), 120);
      });
    });

    // Splash corto, tipo app nativa.
    window.addEventListener("load", () => {
      setTimeout(() => {
        splash.classList.add("hidden");
        app.classList.add("ready");
      }, 650);
    });

    // Estado de conexión.
    function updateConnection(){
      connectionStatus.textContent = navigator.onLine ? "En línea" : "Sin conexión";
    }

    updateConnection();
    window.addEventListener("online", updateConnection);
    window.addEventListener("offline", updateConnection);

    // Detecta si ya está instalada.
    const standalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if(standalone){
      appMode.textContent = "Modo app";
    }

    // Instalación Android / Chrome compatibles.
    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;

      if(!standalone){
        installPanel.classList.add("visible");
      }
    });

    installBtn.addEventListener("click", async () => {
      if(!deferredPrompt) return;

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;

      deferredPrompt = null;
      installPanel.classList.remove("visible");
    });

    window.addEventListener("appinstalled", () => {
      installPanel.classList.remove("visible");
      appMode.textContent = "Modo app";
    });

    // Sensación de transición nativa antes de salir.
    document.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", event => {
        if(
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey ||
          event.button !== 0
        ) return;

        event.preventDefault();

        const target = card.href;
        card.classList.add("leaving");

        setTimeout(() => {
          window.location.href = target;
        }, 145);
      });
    });

    // Service Worker + actualización automática.
    if ("serviceWorker" in navigator) {
      let reloading = false;

      async function registerAndUpdateServiceWorker() {
        try {
          const registration = await navigator.serviceWorker.register("./sw.js", {
            updateViaCache: "none"
          });

          // Comprueba si hay una nueva versión del SW al abrir la app.
          await registration.update();

          // Y vuelve a comprobar cuando regresamos a la app.
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              registration.update().catch(() => {});
            }
          });

          // Si entra en control un SW nuevo, recarga una sola vez.
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });

        } catch (error) {
          console.error("Service Worker:", error);
        }
      }

      window.addEventListener("load", registerAndUpdateServiceWorker);
    }
  </script>

</body>
